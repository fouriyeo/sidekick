<!doctype html>
<!-- 无 JS / 脚本异常时兜底为深色（tokens.css 的 :root 默认值）；脚本正常时首帧即按偏好或系统确定。 -->
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sidekick</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏防闪：在 CSS/React 之前确定主题；key 必须与 shared/lib/theme.ts 一致。
      // 默认跟随系统：缺失/非法值一律按 system 解析（D76）。
      (function () {
        try {
          var raw = window.localStorage.getItem("sidekick:theme");
          var pref = raw === "light" || raw === "dark" || raw === "system" ? raw : "system";
          var light =
            pref === "light" ||
            (pref === "system" &&
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          var root = document.documentElement;
          root.dataset.theme = light ? "light" : "dark";
          root.classList.toggle("dark", !light);
          root.style.colorScheme = light ? "light" : "dark";
        } catch (error) {
          /* localStorage 被禁用时保持默认深色 */
        }

        // 窗口级材质（D86）：真实 Tauri + macOS 才给 <html> 加 .dsl-vibrancy，
        // 让侧栏透出系统 NSVisualEffectView（tauri.macos.conf.json 的 windowEffects）。
        // 浏览器 dev mock 没有 __TAURI_INTERNALS__.metadata，不会触发；localStorage 可一键关闭。
        try {
          var internals = window.__TAURI_INTERNALS__;
          var isMac = /Macintosh|Mac OS X/.test(navigator.userAgent);
          var realTauri = !!internals && "metadata" in internals;
          var disabled = window.localStorage.getItem("sidekick:vibrancy") === "off";
          if (isMac && realTauri && !disabled) {
            document.documentElement.classList.add("dsl-vibrancy");
          }
        } catch (error) {
          /* 检测失败按无材质处理（实色回退） */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
