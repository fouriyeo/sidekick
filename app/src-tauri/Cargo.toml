[package]
name = "desktop"
version = "0.1.0"
description = "Sidekick：把手机变成电脑的外设与 AI 宠物"
authors = ["Sidekick contributors"]
license = "MIT"
repository = "https://github.com/fouriyeo/sidekick"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` 是 `tauri.macos.conf.json › macOSPrivateApi: true` 的硬性前提：
# 主窗口的透明 + NSVisualEffectView（D87）和菜单栏用量小看板的透明圆角窗都依赖它。
# 删掉后 tauri-build 会在 `manifest::check` 直接报 feature allowlist 不匹配，连 cargo test 都跑不了。
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
futures-util = "0.3"
tauri-plugin-store = "2.5.0"
base64 = "0.22"
# 语音备忘录（D115/D118）：双端共用的本地库。bundled 会在两个目标上编译 SQLite，
# Android 由 cargo-ndk 用 NDK 工具链编，不需要系统 sqlite。
rusqlite = { version = "0.41", features = ["bundled"] }
# 同步音频校验用；纯 Rust 实现。
sha2 = "0.10"
# 备忘录 ID / 设备 ID。
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 菜单栏常驻（D88）：托盘/菜单 API 只在桌面目标编译，Android 构建不带这两个 feature。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
# 单实例保护：第二个进程只把已有窗口叫到前台再退出。桌面端跑两个实例会争抢
# UDP 47820 发现端口、互相覆盖 DSH hook 端点（见 docs/decisions.md D60）。
tauri-plugin-single-instance = "2"
arboard = { version = "3", default-features = false }
axum = { version = "0.8", features = ["ws"] }
core-graphics = "0.25"
local-ip-address = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", features = ["clock"] }
# rustls 0.23 必须显式启用一个 CryptoProvider；删掉 reqwest 后 feature 合并不再带进
# aws-lc-rs/ring，云端 TLS 会 panic。用 ring 避免重新引入 cmake/C 构建依赖。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }
# 模型价格目录刷新：只用公开 GET；rustls 用 rustls-no-provider，
# CryptoProvider 由 crate::tls 在启动时用 ring 安装（与 ASR 共用）。
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls-no-provider"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# 语音备忘录（D118）：手机直连百炼 ASR（wss）与兼容模式 LLM（https）。
# webpki roots 是纯 Rust 证书根，绕开 Android 上 rustls-platform-verifier 需要 JNI 初始化的坑。
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[target.'cfg(target_os = "android")'.dependencies]
# 屏幕常亮：通过 JNI 直接调 Android Window.addFlags(FLAG_KEEP_SCREEN_ON)。
# 版本必须与 tauri-runtime-wry 使用的 jni 对齐（0.21），否则 JniHandle::exec 的闭包类型不匹配。
jni = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
security-framework = "3"
# 菜单栏看板的真玻璃底衬（D117，见 src/panel_glass.rs）：CSS 的 backdrop-filter
# 采样不到窗口背后的桌面，只能在 WebView 之下垫一块 NSVisualEffectView。
# 这几个 crate 的版本与 tauri 的传递依赖完全一致（objc2 0.6.5 / objc2-app-kit 0.3.2 /
# objc2-quartz-core 0.3.2），不新增任何 crate，只是显式声明 feature 合并。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSGlassEffectView",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSVisualEffectView",
  "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
