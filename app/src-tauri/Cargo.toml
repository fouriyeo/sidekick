[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
futures-util = "0.3"
tauri-plugin-store = "2.5.0"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false }
axum = { version = "0.8", features = ["ws"] }
core-graphics = "0.25"
local-ip-address = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
whisper-rs = { version = "0.16", features = ["metal"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.24", features = ["connect"] }

[target.'cfg(target_os = "android")'.dependencies]
# 屏幕常亮：通过 JNI 直接调 Android Window.addFlags(FLAG_KEEP_SCREEN_ON)。
# 版本必须与 tauri-runtime-wry 使用的 jni 对齐（0.21），否则 JniHandle::exec 的闭包类型不匹配。
jni = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
security-framework = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
