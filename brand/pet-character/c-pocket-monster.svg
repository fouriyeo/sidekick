<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="c-title"
     style="--body:#C9B8FF;--shade:#A88FEF;--belly:#F0EAFF;--horn:#7FE0C3;--ink:#2E2440;--accent:#FF7A59;--fang:#FFFFFF">
  <title id="c-title">C · 口袋小怪兽（分层）</title>
  <g class="pet-shadow"><ellipse cx="160" cy="292" rx="86" ry="13" fill="#000" opacity=".10"/></g>

  <g class="pet-tail">
    <path d="M 220 246 C 262 252 288 226 276 198" fill="none" stroke="var(--shade)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 276 186 L 292 202 L 274 218 L 260 202 Z" fill="var(--shade)"/>
  </g>

  <g class="pet-legs">
    <ellipse cx="132" cy="282" rx="26" ry="13" fill="var(--shade)"/>
    <ellipse cx="188" cy="282" rx="26" ry="13" fill="var(--shade)"/>
  </g>

  <g class="pet-body">
    <ellipse cx="160" cy="228" rx="66" ry="54" fill="var(--body)"/>
    <ellipse cx="160" cy="240" rx="38" ry="30" fill="var(--belly)"/>
  </g>

  <g class="pet-arms">
    <ellipse cx="86" cy="220" rx="15" ry="21" fill="var(--body)" transform="rotate(18 86 220)"/>
    <ellipse cx="234" cy="220" rx="15" ry="21" fill="var(--body)" transform="rotate(-18 234 220)"/>
  </g>

  <g class="pet-head">
    <path d="M 132 84 L 116 48 L 150 66 Z" fill="var(--horn)" stroke="var(--horn)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 188 84 L 204 48 L 170 66 Z" fill="var(--horn)" stroke="var(--horn)" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="160" cy="136" r="70" fill="var(--body)"/>
    <g class="pet-face">
      <ellipse cx="136" cy="142" rx="9" ry="11" fill="var(--ink)"/>
      <ellipse cx="184" cy="142" rx="9" ry="11" fill="var(--ink)"/>
      <circle cx="139" cy="138" r="3" fill="#fff" opacity=".9"/>
      <circle cx="187" cy="138" r="3" fill="#fff" opacity=".9"/>
      <path d="M 142 164 Q 160 182 178 164" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 150 165 L 155 175 L 160 165 Z" fill="var(--fang)"/>
      <path d="M 160 165 L 165 175 L 170 165 Z" fill="var(--fang)"/>
      <ellipse cx="110" cy="158" rx="10" ry="5.5" fill="var(--accent)" opacity=".30"/>
      <ellipse cx="210" cy="158" rx="10" ry="5.5" fill="var(--accent)" opacity=".30"/>
    </g>
  </g>
</svg>
