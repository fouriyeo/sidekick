<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="b-title"
     style="--body:#F8C877;--shade:#E6AC55;--belly:#FFEFD2;--ink:#3A2E3F;--accent:#FF9E7A;--sprout:#6FCFA8;--stem:#4FB58F">
  <title id="b-title">B · 豆豆泥人（分层）</title>
  <g class="pet-shadow"><ellipse cx="160" cy="292" rx="76" ry="13" fill="#000" opacity=".10"/></g>

  <g class="pet-tail">
    <path d="M 220 252 C 246 254 252 238 244 226" fill="none" stroke="var(--stem)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g class="pet-legs">
    <ellipse cx="132" cy="282" rx="23" ry="12" fill="var(--shade)"/>
    <ellipse cx="188" cy="282" rx="23" ry="12" fill="var(--shade)"/>
  </g>

  <g class="pet-body">
    <ellipse cx="160" cy="232" rx="60" ry="50" fill="var(--body)"/>
    <ellipse cx="160" cy="242" rx="34" ry="28" fill="var(--belly)"/>
  </g>

  <g class="pet-arms">
    <ellipse cx="98" cy="232" rx="13" ry="19" fill="var(--body)" transform="rotate(16 98 232)"/>
    <ellipse cx="222" cy="232" rx="13" ry="19" fill="var(--body)" transform="rotate(-16 222 232)"/>
  </g>

  <g class="pet-head">
    <circle cx="160" cy="136" r="68" fill="var(--body)"/>
    <g class="pet-sprout">
      <path d="M 160 70 C 160 54 158 44 156 34" fill="none" stroke="var(--stem)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 156 38 C 138 26 122 34 124 48 C 138 54 152 50 156 38 Z" fill="var(--sprout)"/>
      <path d="M 160 40 C 178 28 194 36 192 50 C 178 56 164 52 160 40 Z" fill="var(--sprout)"/>
    </g>
    <g class="pet-face">
      <circle cx="136" cy="142" r="7.5" fill="var(--ink)"/>
      <circle cx="184" cy="142" r="7.5" fill="var(--ink)"/>
      <circle cx="138.5" cy="139" r="2.6" fill="#fff" opacity=".9"/>
      <circle cx="186.5" cy="139" r="2.6" fill="#fff" opacity=".9"/>
      <path d="M 152 160 Q 160 167 168 160" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="114" cy="160" rx="10" ry="5.5" fill="var(--accent)" opacity=".35"/>
      <ellipse cx="206" cy="160" rx="10" ry="5.5" fill="var(--accent)" opacity=".35"/>
    </g>
  </g>
</svg>
